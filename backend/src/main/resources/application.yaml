spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/meditrust
    username: postgres
    password: PostgreSQL@4722
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

server:
  port: 8081